<!DOCTYPE html>
<!--
  Published at https://simplekile.github.io/monos-releases/ (root of the public
  monos-releases repo, GitHub Pages from master /), next to open.html,
  favicon.png and shots/. Intro + download page for the studio team.
  The download button asks the GitHub API for the latest release and links its
  .exe; if that fails it stays on the Releases page. Nothing to edit per release.
  Two languages (vi/en) from one table below; the choice is remembered per browser.
  Look follows open.html and the app splash: #09090b, Syne wordmark with the
  accent period, JetBrains Mono details.
  Internal for now: robots noindex. To go public, drop that meta.
-->
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="description" content="Monos, the studio pipeline app for assets, shots, review and delivery.">
<meta property="og:title" content="Monos">
<meta property="og:description" content="The studio pipeline app: assets, shots, review and delivery in one window.">
<meta property="og:image" content="https://simplekile.github.io/monos-releases/shots/shots-comp.webp">
<title>Monos</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Syne:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #09090b;
    --surface: #111114;
    --surface-2: #16161a;
    --line: rgba(255, 255, 255, 0.07);
    --line-2: rgba(255, 255, 255, 0.12);
    --text: #fafafa;
    --text-2: #d4d4d8;
    --muted: #8b8b94;
    --faint: #5c5c66;
    --accent: #3b82f6;
    --accent-2: #93c5fd;
    --ok: #22c55e;
    --warn: #f59e0b;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
    --display: Syne, Inter, system-ui, sans-serif;
    --wrap: 1120px;
    --tilt: 19deg;       /* low camera: the top of each plane leans away */
    --explode: .35;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  html { scroll-behavior: smooth; }
  body {
    color: var(--text); background: var(--bg);
    font: 15px/1.6 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { color: inherit; }
  .wrap { width: 100%; max-width: var(--wrap); margin: 0 auto; padding: 0 16px; }
  @media (min-width: 720px) { .wrap { padding: 0 32px; } }

  /* Top bar */
  header.top { position: sticky; top: 0; z-index: 10; backdrop-filter: blur(12px);
               background: rgba(9, 9, 11, .72); border-bottom: 1px solid var(--line); }
  header.top .wrap { display: flex; align-items: center; gap: 16px; height: 56px; }
  .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .logo img { width: 22px; height: 22px; border-radius: 5px; }
  .logo b { font: 700 19px/1 Syne, Inter, sans-serif; letter-spacing: -.01em; }
  .logo b i { font-style: normal; color: var(--accent); }
  nav.links { display: none; gap: 4px; margin-left: 8px; }
  @media (min-width: 820px) { nav.links { display: flex; } }
  nav.links a { padding: 6px 10px; border-radius: 8px; text-decoration: none; color: var(--muted);
                font-size: 13.5px; font-weight: 500; transition: color .22s ease-out, background .22s ease-out; }
  nav.links a:hover { color: var(--text); background: rgba(255, 255, 255, .05); transition-duration: .08s; }
  .spacer { flex: 1; }

  .lang { display: flex; padding: 2px; border-radius: 8px; background: rgba(255, 255, 255, .04);
          border: 1px solid var(--line); }
  .lang button { all: unset; cursor: pointer; padding: 3px 9px; border-radius: 6px;
                 font: 500 11.5px/18px var(--mono); color: var(--muted);
                 transition: color .22s ease-out, background .22s ease-out; }
  .lang button:hover { color: var(--text); background: rgba(255, 255, 255, .06); transition-duration: .08s; }
  .lang button[aria-pressed="true"] { color: #fff; background: var(--accent); }
  .lang button[aria-pressed="true"]:hover { background: #5c9bff; }
  .lang button:focus-visible { box-shadow: 0 0 0 2px rgba(96, 165, 250, .7); }

  /* Buttons (same recipe as open.html) */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
         font-weight: 600; border-radius: 10px; cursor: pointer; user-select: none; outline: none; white-space: nowrap;
         transition: background .22s ease-out, border-color .22s ease-out, color .22s ease-out,
                     box-shadow .22s ease-out, transform .22s ease-out; }
  .btn svg { width: 16px; height: 16px; flex: none; }
  .btn:hover, .btn:active { transition-duration: .08s; }
  .btn:focus-visible { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px rgba(96, 165, 250, .7); }
  .btn-primary { height: 48px; padding: 0 22px 0 18px; font-size: 15px; color: #fff;
                 background: linear-gradient(180deg, #4b8df8 0%, #2f6fe4 100%);
                 border: 1px solid rgba(255, 255, 255, .10);
                 box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22), 0 8px 24px -10px rgba(59, 130, 246, .75); }
  .btn-primary:hover { background: linear-gradient(180deg, #5c9bff 0%, #3b7cf0 100%);
                       box-shadow: inset 0 1px 0 rgba(255, 255, 255, .28), 0 10px 28px -10px rgba(59, 130, 246, .9); }
  .btn-primary:active { transform: translateY(1px); background: linear-gradient(180deg, #2f6fe4 0%, #2563eb 100%);
                        box-shadow: inset 0 1px 2px rgba(0, 0, 0, .25), 0 4px 12px -8px rgba(59, 130, 246, .6); }
  .btn-small { height: 34px; padding: 0 14px 0 12px; font-size: 13px; }
  .btn-ghost { height: 48px; padding: 0 18px; font-size: 14px; font-weight: 500; color: var(--text-2);
               background: rgba(255, 255, 255, .03); border: 1px solid var(--line-2); }
  .btn-ghost:hover { color: var(--text); background: rgba(59, 130, 246, .10); border-color: rgba(59, 130, 246, .45); }
  .btn-ghost:active { transform: translateY(1px); background: rgba(59, 130, 246, .16); }

  /* Hero */
  .hero { position: relative; padding: 72px 0 0; text-align: center; }
  .hero::before { content: ""; position: absolute; inset: -80px 0 auto; height: 620px; pointer-events: none;
                  background: radial-gradient(640px 360px at 50% 30%, rgba(59, 130, 246, .16), transparent 70%); }
  .eyebrow { position: relative; display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px 5px 10px;
             border-radius: 999px; background: rgba(255, 255, 255, .04); border: 1px solid var(--line);
             font: 500 11.5px/1 var(--mono); letter-spacing: .04em; color: var(--muted); }
  .eyebrow .pip { width: 6px; height: 6px; border-radius: 50%; background: var(--ok);
                  box-shadow: 0 0 0 3px rgba(34, 197, 94, .15); }
  .hero h1 { position: relative; margin: 22px 0 0; font: 700 clamp(56px, 11vw, 104px)/.95 Syne, Inter, sans-serif;
             letter-spacing: -.025em; }
  .hero h1 i { font-style: normal; color: var(--accent); }
  .hero p.lede { position: relative; max-width: 620px; margin: 20px auto 0; color: var(--text-2);
                 font-size: clamp(16px, 2.2vw, 19px); line-height: 1.55; }
  .cta { position: relative; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 32px; }
  .meta { position: relative; margin-top: 14px; min-height: 18px; font: 400 12px/1.5 var(--mono); color: var(--faint); }
  .meta b { color: var(--muted); font-weight: 500; }

  /* 3D showcase: hero stage and feature close-ups */
  /* ---------- 3D primitives ---------- */
  .stage { position: relative; perspective: var(--persp, 700px); perspective-origin: 50% 115%; }
  .rig { position: relative; transform-style: preserve-3d; margin-inline: auto;
         transform: rotateX(calc(var(--tilt) * var(--tk, 1))) rotateY(calc(var(--yaw, 0deg) + var(--px, 0) * 5deg))
                    rotateZ(var(--roll, 0deg));
         transition: transform .7s cubic-bezier(.2, .7, .2, 1); }
  .stage:hover .rig { transition-duration: .25s; }
  .layer, .lift { transform-style: preserve-3d; }
  .layer { position: absolute;
           transform: translateZ(calc(var(--z, 0) * 1px * var(--explode) * var(--ek, 1)));
           transition: transform .5s cubic-bezier(.2, .7, .2, 1); }
  .layer.flow { position: relative; }
  .lift { position: relative; transform: translateZ(calc(var(--z, 0) * 1px * var(--explode) * var(--ek, 1)));
          transition: transform .5s cubic-bezier(.2, .7, .2, 1); }

  /* crop: a window onto one region of a capture (data-box in capture pixels) */
  .crop { position: relative; overflow: hidden; border-radius: 8px; background: #131316;
          box-shadow: 0 0 0 1px rgba(255, 255, 255, .10), 0 30px 60px -20px rgba(0, 0, 0, .9),
                      0 1px 0 0 rgba(255, 255, 255, .14) inset; }
  .crop img { position: absolute; max-width: none; display: block; user-select: none; -webkit-user-drag: none; }
  .crop::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
                 background: linear-gradient(160deg, rgba(255, 255, 255, .07) 0%, transparent 28%); }
  .base .crop { border-radius: 14px; }
  .base .crop img { filter: brightness(.5) saturate(.8); }

  .floor { position: absolute; left: 6%; right: 6%; bottom: -6%; height: 24%; pointer-events: none;
           background: radial-gradient(50% 50% at 50% 50%, rgba(59, 130, 246, .28), transparent 70%);
           filter: blur(18px); transform: translateZ(-60px); }

  .pill { display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; border-radius: 999px; white-space: nowrap;
          font: 500 12px/1 var(--mono); color: var(--text); background: rgba(22, 22, 26, .92);
          border: 1px solid var(--line-2); box-shadow: 0 14px 30px -12px rgba(0, 0, 0, .9); }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 10px var(--ok); }
  .pill.warn .dot { background: var(--warn); box-shadow: 0 0 10px var(--warn); }
  .pill.blue { border-color: rgba(59, 130, 246, .5); color: var(--accent-2); }
  .pill.blue .dot { background: var(--accent); box-shadow: 0 0 10px var(--accent); }

  /* ---------- feature shots ---------- */
  section.shot { padding-block: 72px 24px; overflow-x: clip; }
  .shot .wrap { display: grid; gap: 8px 40px; align-items: center; grid-template-columns: 1fr; }
  @media (min-width: 900px) {
    .shot .wrap { grid-template-columns: 5fr 7fr; }
    .shot.flip .wrap { grid-template-columns: 7fr 5fr; }
    .shot.flip .copy { order: 2; }
  }
  .copy { min-width: 0; }
  .shot .kicker { display: flex; gap: 10px; align-items: center; }
  .kicker .new { padding: 3px 7px; border-radius: 999px; font-size: 10.5px; letter-spacing: .04em; color: var(--ok);
                 background: rgba(34, 197, 94, .1); border: 1px solid rgba(34, 197, 94, .3); }
  .copy h2 { margin: 14px 0 0; font: 700 clamp(28px, 4vw, 40px)/1.08 var(--display); letter-spacing: -.015em;
             text-wrap: balance; }
  .copy p { margin: 14px 0 0; max-width: 46ch; color: var(--muted); }
  .shot .stage { padding-block: 60px; min-width: 0; }
  .shot .rig { width: min(560px, 80%); }
  .shot .stage { --explode: 0; --ek: .8; }

  .shot .stage { perspective-origin: 50% 70%; }
  .hero .stage { margin-top: 8px; padding-block: 60px 80px; }
  .hero .rig { width: min(960px, 86%); aspect-ratio: 1920 / 1200; --yaw: -16deg; --roll: 1.5deg; }
  .tlabel { position: absolute; right: 10px; top: -13px; font: 500 10.5px/1 var(--mono); color: var(--text-2); padding: 5px 9px; border-radius: 999px;
            background: rgba(17, 17, 20, .94); border: 1px solid var(--line-2); white-space: nowrap; }
  .swatches { display: flex; gap: 8px; padding: 8px 10px; border-radius: 100px; background: rgba(22, 22, 26, .94); border: 1px solid var(--line-2);
              box-shadow: 0 14px 30px -12px rgba(0, 0, 0, .9); }
  .swatches i { width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .2); }
  .swatches i.on { box-shadow: 0 0 0 2px #09090b, 0 0 0 4px #fafafa; }
  .more-title { margin: 0; font-size: 18px; font-weight: 600; color: var(--text-2); }
  .grid.grid-4 { margin-top: 20px; }
  @media (min-width: 980px) { .grid.grid-4 { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 640px) {
    :root { --tilt: 10deg; }
    .hero .stage { padding-block: 40px 60px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .rig, .layer, .lift { transition: none; }
  }

  /* Sections */
  section.block { padding: 96px 0 0; }
  .kicker { font: 500 11.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
  h2 { margin: 12px 0 0; font: 700 clamp(28px, 4.4vw, 40px)/1.1 Syne, Inter, sans-serif; letter-spacing: -.015em; }
  .sub { margin: 12px 0 0; max-width: 620px; color: var(--muted); }

  .grid { display: grid; gap: 14px; margin-top: 36px; grid-template-columns: 1fr; }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 980px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  .card { padding: 22px 22px 20px; border-radius: 14px; border: 1px solid var(--line);
          background: linear-gradient(180deg, var(--surface-2) 0%, var(--surface) 100%);
          box-shadow: inset 0 1px 0 rgba(255, 255, 255, .03);
          transition: border-color .22s ease-out, transform .22s ease-out; }
  .card:hover { border-color: var(--line-2); transform: translateY(-2px); transition-duration: .08s; }
  .card .ico { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px;
               color: var(--accent-2); background: rgba(59, 130, 246, .12); border: 1px solid rgba(59, 130, 246, .25); }
  .card .ico svg { width: 18px; height: 18px; }
  .card h3 { margin: 16px 0 0; font-size: 16px; font-weight: 600; }
  .card p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }

  .dccs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 28px; }
  .chip { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255, 255, 255, .03);
          font: 500 12.5px/1.2 var(--mono); color: var(--text-2); }

  /* Install */
  .install { display: grid; gap: 28px; margin-top: 36px; grid-template-columns: 1fr; }
  @media (min-width: 900px) { .install { grid-template-columns: 1.4fr 1fr; gap: 40px; } }
  ol.steps { list-style: none; counter-reset: s; margin: 0; padding: 0; display: grid; gap: 12px; }
  ol.steps li { counter-increment: s; position: relative; padding: 16px 18px 16px 58px; border-radius: 12px;
                border: 1px solid var(--line); background: var(--surface); }
  ol.steps li::before { content: counter(s, decimal-leading-zero); position: absolute; left: 18px; top: 16px;
                        font: 500 13px/24px var(--mono); color: var(--accent); }
  ol.steps b { display: block; font-weight: 600; }
  ol.steps span { display: block; margin-top: 2px; color: var(--muted); font-size: 14px; }
  .req { padding: 22px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); align-self: start; }
  .req h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .req ul { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; }
  .req li { display: flex; gap: 10px; color: var(--text-2); font-size: 14px; }
  .req li svg { width: 16px; height: 16px; flex: none; margin-top: 3px; color: var(--ok); }
  .note { margin-top: 16px; padding: 12px 14px; border-radius: 10px; font-size: 13px; color: var(--text-2);
          background: rgba(245, 158, 11, .08); border: 1px solid rgba(245, 158, 11, .25); }
  .note b { color: var(--warn); }

  /* Releases: the latest as a card, then a timeline grouped by minor version */
  .rel { margin-top: 36px; display: grid; gap: 40px; }
  .rel-empty { color: var(--muted); font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .cchip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 999px; white-space: nowrap;
           font: 500 11px/1.3 var(--mono); border: 1px solid; font-variant-numeric: tabular-nums; }
  .cchip i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .cchip.new { color: #93c5fd; background: rgba(59, 130, 246, .10); border-color: rgba(59, 130, 246, .32); }
  .cchip.improved { color: #c4b5fd; background: rgba(139, 92, 246, .10); border-color: rgba(139, 92, 246, .32); }
  .cchip.fixed { color: #fcd34d; background: rgba(245, 158, 11, .09); border-color: rgba(245, 158, 11, .30); }
  .cchip.changes { color: var(--muted); background: rgba(255, 255, 255, .03); border-color: var(--line-2); }
  .rel .latest { padding: 3px 8px; border-radius: 999px; font: 500 10.5px/1.2 var(--mono); color: var(--ok);
                 background: rgba(34, 197, 94, .1); border: 1px solid rgba(34, 197, 94, .3); }

  .rel-hero { position: relative; padding: 28px; border-radius: 18px; border: 1px solid var(--line-2); overflow: hidden;
              background: radial-gradient(560px 220px at 0% 0%, rgba(59, 130, 246, .14), transparent 70%), var(--surface); }
  .rel-hero .top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
  .rel-hero .ver { font: 700 clamp(34px, 5vw, 48px)/1 var(--display); letter-spacing: -.02em; }
  .rel-hero .when { font: 400 12px/1.4 var(--mono); color: var(--faint); }
  .rel-hero h3 { margin: 16px 0 0; font-size: clamp(18px, 2.4vw, 22px); font-weight: 600; text-wrap: balance; max-width: 40ch; }
  .rel-hero .chips { margin-top: 14px; }
  .rel-hero .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
  .rel-hero .body { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }

  .rel .body { color: var(--text-2); font-size: 14px; max-width: 76ch; }
  .rel .body h4 { margin: 16px 0 4px; font: 500 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .rel .body h4:first-child { margin-top: 0; }
  .rel .body p { margin: 12px 0 2px; }
  .rel .body p b { color: var(--text); font-weight: 600; }
  .rel .body ul { margin: 4px 0 0; padding-left: 18px; }
  .rel .body li { margin: 4px 0; }
  .rel .body li::marker { color: var(--faint); }
  .rel .body code { font: 12.5px var(--mono); color: var(--accent-2); }

  .tl { display: grid; gap: 28px; }
  .tl-group { display: grid; grid-template-columns: 1fr; gap: 10px; position: relative; }
  @media (min-width: 760px) { .tl-group { grid-template-columns: 120px 1fr; gap: 24px; } }
  .tl-label { display: flex; flex-direction: column; gap: 4px; }
  @media (min-width: 760px) { .tl-label { position: sticky; top: 76px; align-self: start; padding-top: 12px; } }
  .tl-label b { font: 700 26px/1 var(--display); letter-spacing: -.01em; }
  .tl-label span { font: 400 11.5px/1.3 var(--mono); color: var(--faint); }
  .tl-rows { display: grid; gap: 8px; }
  .tl-rows details { border-radius: 12px; border: 1px solid var(--line); background: var(--surface); overflow: hidden;
                     transition: border-color .22s ease-out; scroll-margin-top: 80px; }
  .tl-rows details:hover { border-color: var(--line-2); transition-duration: .08s; }
  .tl-rows details:target, .tl-rows details.hit { border-color: rgba(59, 130, 246, .55); }
  .tl-rows summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: auto 1fr auto; align-items: center;
                     gap: 6px 14px; padding: 13px 16px; transition: background .22s ease-out; }
  .tl-rows summary::-webkit-details-marker { display: none; }
  .tl-rows summary:hover { background: rgba(255, 255, 255, .03); transition-duration: .08s; }
  .tl-rows summary:focus-visible { outline: none; box-shadow: inset 0 0 0 2px rgba(96, 165, 250, .7); }
  .tl-rows .tag { font: 500 13px/1 var(--mono); color: var(--text); min-width: 64px; }
  .tl-rows .head { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); font-size: 14px; }
  .tl-rows .side { display: flex; align-items: center; gap: 10px; }
  .tl-rows .date { font: 400 12px/1 var(--mono); color: var(--faint); font-variant-numeric: tabular-nums; }
  .tl-rows .chev { width: 16px; height: 16px; color: var(--faint); transition: transform .22s ease-out; }
  .tl-rows details[open] .chev { transform: rotate(180deg); }
  .tl-rows .chips { grid-column: 2 / -1; }
  @media (max-width: 640px) {
    .tl-rows summary { grid-template-columns: auto 1fr; }
    .tl-rows .side { grid-column: 1 / -1; order: 3; }
    .tl-rows .chips { grid-column: 1 / -1; }
    .tl-rows .head { white-space: normal; }
  }
  .tl-rows .body { padding: 14px 16px 16px; border-top: 1px solid var(--line); }
  .tl-rows .body .dl { display: inline-flex; margin-top: 14px; }
  .rel .older { justify-self: start; margin-left: 0; }
  @media (min-width: 760px) { .rel .older { margin-left: 144px; } }
  .copylink { all: unset; cursor: pointer; font: 500 11.5px/1 var(--mono); color: var(--muted); padding: 6px 8px; border-radius: 8px;
              margin-left: 8px; transition: color .22s ease-out, background .22s ease-out; }
  .copylink:hover { color: var(--text); background: rgba(255, 255, 255, .05); transition-duration: .08s; }
  .copylink:focus-visible { box-shadow: 0 0 0 2px rgba(96, 165, 250, .7); }

  .more { display: inline-block; margin-top: 16px; font-size: 14px; color: var(--muted); text-decoration: none; }
  .more:hover { color: var(--text); }

  /* Final CTA + footer */
  .final { margin: 110px 0 0; padding: 48px 24px; text-align: center; border-radius: 18px; border: 1px solid var(--line);

  var lang = "vi", latest = null, releases = null;

  // Release notes are Markdown; show headings, bullets, bold and code, everything else escaped.
  // CI notes repeat the title, prefix each change with its commit hash and end with an
  // installer footnote; drop those so only the changes remain.
  function notes(md) {
    var out = [], inList = false;
    String(md || "").split(/\r?\n/).forEach(function (line) {
      if (/^#{1,6}\s+Monos\s+v?\d/i.test(line) || /^\s*_.*_\s*$/.test(line)) return;
      line = line.replace(/^(\s*[-*]\s+)[0-9a-f]{7,40}\s+/i, "$1");
      if (/^\s*[-*]\s+Bump VERSION/i.test(line)) return;
      var inline = function (s) {
        return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
      };
      var m;
      if ((m = line.match(/^\s*[-*]\s+(.*)/))) {
        if (!inList) { out.push("<ul>"); inList = true; }
        out.push("<li>" + inline(m[1]) + "</li>");
        return;
      }
      if (inList) { out.push("</ul>"); inList = false; }
      if ((m = line.match(/^#{1,6}\s+(.*)/))) out.push("<h4>" + inline(m[1]) + "</h4>");
      else if (line.trim()) out.push("<p>" + inline(line) + "</p>");
    });
    if (inList) out.push("</ul>");
    return out.join("");
  }

  function renderMeta() {
    var T = TEXT[lang], el = $("meta");

    if (!latest) { el.textContent = T.metaFail; return; }

    if (exe) parts.push(fmtSize(exe.size));
    parts.push(fmtDate(latest.published_at), "Windows 10/11 · 64-bit");
    el.innerHTML = parts.filter(Boolean).join(" · ");
  }

  // One release body -> { headline, counts }. New notes group bullets under ### New / Improved /
  // Fixed with **Feature** lines; older CI notes are a ### Changes list of commit subjects.
  var SECTION = { "new": "new", "improved": "improved", "fixed": "fixed", "changes": "changes" };
  function digest(md) {
    var sec = "", counts = { "new": 0, improved: 0, fixed: 0, changes: 0 }, groups = {}, firstBullet = "";
    String(md || "").split(/\r?\n/).forEach(function (line) {
      var m;
      if ((m = line.match(/^#{2,6}\s+(.*)/))) { sec = SECTION[m[1].trim().toLowerCase()] || ""; return; }
      if (!sec) return;
      if ((m = line.match(/^\s*\*\*(.+?)\*\*\s*$/))) { if (!groups[sec]) groups[sec] = m[1]; return; }
      if ((m = line.match(/^\s*[-*]\s+(?:[0-9a-f]{7,40}\s+)?(.*)/i))) {
        if (/^Bump VERSION/i.test(m[1])) return;

    order.some(function (k) { return (head = groups[k] || "") && true; });

    if (!head) head = firstBullet;

    if (head.length > 72) { var cutAt = head.search(/(: |\. |; | \()/); if (cutAt > 20) head = head.slice(0, cutAt); }
    if (head.length > 90) head = head.slice(0, 88).replace(/\s+\S*$/, "") + "…";
    return { head: head, counts: counts };
  }

  function chips(counts) {
    var T = TEXT[lang];
    return '<div class="chips">' + ["new", "improved", "fixed", "changes"].filter(function (k) { return counts[k]; })
      .map(function (k) {
        var label = T["rel" + k.charAt(0).toUpperCase() + k.slice(1)];
        return '<span class="cchip ' + k + '"><i></i>' + counts[k] + " " + esc(label) + "</span>";

  }

  function ago(iso) {
    var d = new Date(iso); if (isNaN(d) || !window.Intl || !Intl.RelativeTimeFormat) return "";

  }

  function renderReleases() {
    var T = TEXT[lang], box = $("rel");
    if (releases === null) { box.innerHTML = '<p class="rel-empty">' + esc(T.relLoading) + "</p>"; return; }
    if (!releases.length) { box.innerHTML = '<p class="rel-empty">' + esc(T.relFail) + "</p>"; return; }

    var html = '<article class="rel-hero" id="' + idOf(first.tag_name) + '">' +
      '<div class="top"><span class="ver">' + esc(String(first.tag_name).replace(/^v/, "")) + '</span>' +
      '<span class="latest">' + esc(T.relLatest) + '</span>' +
      '<span class="when">' + esc(T.relReleased) + " " + esc(ago(first.published_at)) + " · " + fmtDate(first.published_at) + "</span></div>" +
      (d0.head ? "<h3>" + esc(d0.head) + "</h3>" : "") + chips(d0.counts) +
      '<div class="actions">' + (exe0 ? '<a class="btn btn-primary btn-small" href="' + esc(exe0.browser_download_url) + '" rel="noopener">' +
        esc(T.relDl) + " · " + fmtSize(exe0.size) + "</a>" : "") +
        '<button type="button" class="copylink" data-copy="' + idOf(first.tag_name) + '">' + esc(T.relCopy) + "</button></div>" +

    // The rest, grouped by minor version, newest first.

    html += '<div class="tl">' + groups.map(function (k, gi) {

            chips(dg.counts) + "</summary>" +

  // #v27.5.0 opens that release and scrolls to it (once the list is in).

    var b = box(el.dataset.box), x = b[0], y = b[1], w = b[2], h = b[3];
    var dm = el.dataset.dim ? box(el.dataset.dim) : [SW, SH];
    if (!el.hasAttribute('data-fill')) el.style.aspectRatio = w + ' / ' + h;
    if (!el.style.width) el.style.width = '100%';
    if (el.hasAttribute('data-fill')) el.style.height = '100%';

    img.src = el.dataset.src; img.alt = ''; img.decoding = 'async';

    img.style.height = (dm[1] / h * 100) + '%';
    img.style.left = (-x / w * 100) + '%';
    img.style.top = (-y / h * 100) + '%';

    el.style.left = ((p[0] - r[0]) / r[2] * 100) + '%';
    el.style.top = ((p[1] - r[1]) / r[3] * 100) + '%';

  // Lens: perspective distance = stage width * focal / 36 (full-frame horizontal).

  function applyLens() {

  window.addEventListener('scroll', function () { onScroll(); onShots(); }, { passive: true });
  window.addEventListener('resize', onShots);

  // The rig turns a little toward the cursor.
  if (!reduce) stages.forEach(function (st) {
    st.addEventListener('pointermove', function (e) {
      var r = st.getBoundingClientRect();
      st.style.setProperty('--px', (((e.clientX - r.left) / r.width) * 2 - 1).toFixed(3));
    });
    st.addEventListener('pointerleave', function () { st.style.setProperty('--px', 0); });
  });

  window.addEventListener('resize', applyLens);
  applyLens(); onScroll(); onShots();

  // One call gives the latest release (download links, meta line) and the list below.
  fetch("https://api.github.com/repos/" + REPO + "/releases?per_page=24")
    .then(function (r) { return r.ok ? r.json() : []; })
    .then(function (list) {
      list = (list || []).filter(function (r) { return !r.draft && !r.prerelease; });
      releases = list; latest = list[0] || false;
      var exe = latest && exeOf(latest);
      if (exe) document.querySelectorAll(".dl-link").forEach(function (a) { a.href = exe.browser_download_url; });
      if (latest) $("foot-ver").textContent = latest.tag_name;
      renderMeta(); renderReleases();
    })
    .catch(function () { releases = []; latest = false; renderMeta(); renderReleases(); });
})();
</script>
</body>
</html>
